worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format upstream '$time_iso8601 $request_method $request_uri status=$status upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout upstream;

    upstream api {
        server api-1:8000 max_fails=0;
        server api-2:8000 max_fails=0;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream off;
        }
    }
}
